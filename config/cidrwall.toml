[files]
inbound = "/data/inbound.txt"
outbound = "/data/outbound.txt"

[zones]
WAN = ["eth0"]
LOCAL = { interfaces = [], local = true }
LAN = ["eth1"]
GUEST = ["eth2"]
VPN1 = ["wg0"]
VPN2 = ["wg1"]

[nftables]
table = "cidrwall"
priority = -5
batch_page_bytes = 131072
populate_batch_elements = 2000
allow_flowtable_bypass = false
cleanup_on_exit = false

[xdp]
mode = "auto"
pin_path = "/sys/fs/bpf/cidrwall"
ipv4_max_entries = 5000000
ipv6_max_entries = 5000000
populate_batch_elements = 2000
allow_nftables_overlap = false
cleanup_on_exit = false

[tc]
pin_path = "/sys/fs/bpf/cidrwall-tc"
ipv4_max_entries = 5000000
ipv6_max_entries = 5000000
populate_batch_elements = 2000
attach_order = "first"
allow_nftables_overlap = false
allow_hardware_flowtable_bypass = false
cleanup_on_exit = false

[runtime]
debounce_ms = 500
reconcile_secs = 60

# Uncomment to serve Prometheus metrics at http://127.0.0.1:9737/metrics. `listen` takes one
# address or a list, e.g. ["127.0.0.1:9737", "[::1]:9737"]; "[::]:9737" is dual-stack.
# [metrics]
# listen = "127.0.0.1:9737"

# Uncomment to write the same state as JSON every `interval_secs`, for local status tools.
# [status]
# file = "/run/cidrwall/status.json"
# interval_secs = 5

[[xdp.rules]]
blocklist = "inbound"
ingress_zones = ["WAN"]

[[tc.rules]]
blocklist = "outbound"
egress_zones = ["WAN"]
