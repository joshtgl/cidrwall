[package]
name = "cidrwall-common"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared userspace/eBPF map ABI for cidrwall"
repository = "https://github.com/joshtgl/cidrwall"

[features]
default = []
user = ["aya"]

[lints.clippy]
# Runtime code must return errors instead of panicking. Tests are exempt via clippy.toml.
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[dependencies]
aya = { version = "0.16.0", optional = true }
